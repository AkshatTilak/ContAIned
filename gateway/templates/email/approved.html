<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Account Approved — ContAIned</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
  <h2>Account Approved!</h2>
  <p>Hello {{ display_name or 'there' }},</p>
  <p>Your account request on ContAIned has been approved by an administrator.</p>
  <p style="margin-top: 25px;">
    <a href="{{ app_url }}/login" style="background-color: #10b981; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold; display: inline-block;">Log In Now</a>
  </p>
  <p style="font-size: 0.9em; color: #666; margin-top: 20px;">
    Visit <a href="{{ app_url }}">{{ app_url }}</a> to access your workspace.
  </p>
</body>
</html>
