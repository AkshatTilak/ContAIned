services:
  # ──────────────────────────────────────────────
  # Test Infrastructure Stack: Isolated Ports & Ephemeral Volumes
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: contained_platform_test
      POSTGRES_USER: contained
      POSTGRES_PASSWORD: contained_pass
    ports:
      - "5433:5432"
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh
      - ./init-db.sql:/docker-entrypoint-initdb.d/02-init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contained -d contained_platform_test"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: "no"
    networks:
      - test_net

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6334:6333"
      - "6335:6334"
    volumes:
      - test_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: "no"
    networks:
      - test_net

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly no
    ports:
      - "6380:6379"
    volumes:
      - test_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: "no"
    networks:
      - test_net

  neo4j:
    image: neo4j:5.20.0
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/contained_pass
    volumes:
      - test_neo4j_data:/data
      - test_neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "contained_pass", "RETURN 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: "no"
    networks:
      - test_net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2182:2181"
    volumes:
      - test_zookeeper_data:/var/lib/zookeeper/data
      - test_zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: "no"
    networks:
      - test_net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - test_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    restart: "no"
    networks:
      - test_net

networks:
  test_net:
    driver: bridge

volumes:
  test_postgres_data:
  test_qdrant_data:
  test_redis_data:
  test_neo4j_data:
  test_neo4j_logs:
  test_zookeeper_data:
  test_zookeeper_log:
  test_kafka_data:
